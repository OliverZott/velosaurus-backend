name: CI

# feature branches / PRs: test
# main:                   test -> docker -> publish
on:
  push:
    paths-ignore:
      - "README.md"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "README.md"
  workflow_dispatch:

# a newer push cancels the older run of the same branch (never on main, so a publish is never interrupted)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  IMAGE: dasmuesli/velosaurus-backend

jobs:
  # =====================================================================================================
  # build and run unit tests (all branches and PRs)
  test:
    name: Build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.x"

      - name: Install dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Unit tests
        run: dotnet test --configuration Release --no-build --verbosity normal

  # =====================================================================================================
  # start docker compose stack and check api + db work together (main only)
  docker:
    name: Docker compose check
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # docker-compose.local.yml: build api from this commit, not the published image
      - name: Validate compose file
        run: docker compose -f docker-compose.yml -f docker-compose.local.yml config --quiet

      - name: Build and start stack
        run: docker compose -f docker-compose.yml -f docker-compose.local.yml up --detach --build --wait

      - name: Smoke test api (health endpoint checks db connection)
        run: curl --fail --silent --show-error --retry 10 --retry-delay 3 --retry-all-errors http://localhost:8000/health

      - name: Show container logs
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.local.yml logs

      - name: Stop stack
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.local.yml down --volumes

  # =====================================================================================================
  # build and push image to Docker Hub (main only, after test + docker passed)
  publish:
    name: Publish docker image
    needs: docker
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

      - name: Show Docker Hub link
        run: echo "Docker image published to https://hub.docker.com/r/${{ env.IMAGE }}"
