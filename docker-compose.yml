# Local development stack: database + rest api
# containers: velosaurus-dev-db-1, velosaurus-dev-api-1, volume velosaurus-dev_db-data (separate from velosaurus-deployment)
# api: http://localhost:8000/swagger, db: localhost:5433 (change with API_PORT / DB_PORT)
name: velosaurus-dev

services:
  # Database
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=velosaurus
    ports:
      - "${DB_PORT:-5433}:5432" # host port, containers use db:5432
    volumes:
      - db-data:/var/lib/postgresql
      # demo data: data/init.sql (pg_dump incl. tables + EF migration history), only runs on an empty volume
      - ./data:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # -h 127.0.0.1: check over TCP, so the temporary server that loads init.sql doesn't count as ready
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d velosaurus"]
      interval: 5s
      timeout: 5s
      retries: 10

  # REST API
  api:
    # always built from local code (published images are used in velosaurus-deployment)
    build:
      context: .
      dockerfile: Dockerfile
    image: velosaurus-backend:local # own tag, never overwrites the published image
    pull_policy: build
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:6789" # host port, 6789 inside container
    environment:
      - ASPNETCORE_URLS=http://+:6789 # default asp.net core port is 8080 (since net8), other ports has to be specified here
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__ActivityDbConnectionString=Host=db; Database=velosaurus; Port=5432; User Id=postgres; Password=password

volumes:
  db-data:
