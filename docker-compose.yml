# Local development stack: database + rest api
# containers: velosaurus-backend-db-1, velosaurus-backend-api-1 (own project name, separate from velosaurus-deployment)
# api: http://localhost:8000/swagger, db: localhost:5433 (change with API_PORT / DB_PORT)
name: velosaurus-backend

services:
  # Database
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=velosaurus
    ports:
      - "${DB_PORT:-5433}:5432" # host port, containers use db:5432
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d velosaurus"]
      interval: 5s
      timeout: 5s
      retries: 10

  # REST API
  api:
    # always built from local code (published images are used in velosaurus-deployment)
    build:
      context: .
      dockerfile: Dockerfile
    image: velosaurus-backend:local # own tag, never overwrites the published image
    pull_policy: build
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:6789" # host port, 6789 inside container
    environment:
      - ASPNETCORE_URLS=http://+:6789 # default asp.net core port is 8080 (since net8), other ports has to be specified here
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__ActivityDbConnectionString=Host=db; Database=velosaurus; Port=5432; User Id=postgres; Password=password

volumes:
  db-data:
